<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mini Gemini</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="logo-area">○</div>
<div class="title">Mini</div>

<label class="key-label" for="api-key">Gemini API key</label>
<input id="api-key" type="password" placeholder="Dán Gemini API key từ Google AI Studio" />
<button id="btn-save" class="btn-open">Lưu key</button>
<div id="key-status" class="key-status"></div>

<div class="divider"><hr><span>hoặc</span><hr></div>

<button id="btn-open" class="btn-ghost">Mở bản full</button>

<div class="shortcut-hint">Bôi đen text → nút ○ Hỏi<br>Alt+G để hỏi nhanh</div>
<div class="help"><a href="https://aistudio.google.com/apikey" target="_blank">Lấy key miễn phí ở đây</a></div>
<div class="footer">v2.3.0 · mini panel, không popup to</div>

<script src="popup.js"></script>
</body>
</html>
